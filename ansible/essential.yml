- name: Setup essential softwares
  hosts: local

  tasks:
    - name: Check if Homebrew is installed on Apple Silicon
      stat:
        path: /opt/homebrew/bin/brew
      register: brew_binary

    - name: Create sources directory
      file:
        path: "{{item}}"
        state: directory
      with_items:
        - ~/Sources
        - ~/Projects

    - name: Install git
      homebrew:
        name: git
        state: present

    - name: Install openssl
      homebrew:
        name: openssl
        state: present

    - name: Install pnpm
      homebrew:
        name: pnpm
        state: present

    - name: Clone oh-my-zsh
      git:
        repo: https://github.com/robbyrussell/oh-my-zsh.git
        dest: "~/Sources/oh-my-zsh"
        update: no
        recursive: no

    - name: Install Auto suggestions plugin for Zsh
      git:
        repo: https://github.com/zsh-users/zsh-autosuggestions
        dest: ~/Sources/oh-my-zsh/custom/plugins/zsh-autosuggestions
        update: no
        recursive: no

    - name: Install Syntax highlighting plugin for Zsh
      git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting
        dest: ~/Sources/oh-my-zsh/custom/plugins/zsh-syntax-highlighting
        update: no
        recursive: no

    - name: Clone Powerlevel10k theme
      git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: ~/powerlevel10k
        depth: 1
        update: no
        recursive: no

    - name: Install MesloLGS NF fonts (required for p10k icons)
      copy:
        src: "static/fonts/{{ item }}"
        dest: "~/Library/Fonts/{{ item }}"
        force: no
      with_items:
        - "MesloLGS NF Regular.ttf"
        - "MesloLGS NF Bold.ttf"
        - "MesloLGS NF Italic.ttf"
        - "MesloLGS NF Bold Italic.ttf"

    - name: Install nvm
      git:
        repo: https://github.com/nvm-sh/nvm.git
        dest: ~/.nvm
        version: v0.40.4
        update: no
        recursive: no

    - name: Install Node 20.19.4 via nvm
      shell: |
        source ~/.nvm/nvm.sh
        nvm install 20.19.4
        nvm alias default 20.19.4
      args:
        executable: /bin/zsh
        creates: ~/.nvm/versions/node/v20.19.4/bin/node

    - name: Create ~./oh-my-zsh symlink
      file:
        path: ~/.oh-my-zsh
        src: ~/Sources/oh-my-zsh
        state: link

    - name: Copy .zshrc to user's Home
      template:
        src: ./static/.zshrc
        dest: ~/.zshrc
        force: no

    - name: Copy .p10k.zsh to user's Home
      copy:
        src: ./static/.p10k.zsh
        dest: ~/.p10k.zsh
        force: no

    - name: Set Zsh as the default shell!
      become: true
      become_method: sudo
      user:
        name: '{{ansible_user}}'
        shell: /bin/zsh

    - name: Add Homebrew to PATH in zsh config
      blockinfile:
        path: ~/.zshrc
        marker: "# {mark} HOMEBREW PATH"
        block: |
          eval "$(/opt/homebrew/bin/brew shellenv)"
      when: brew_binary.stat.exists