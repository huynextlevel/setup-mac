- name: Setup Dependencies for React Native
  hosts: local

  tasks:
    - name: Install watchman
      homebrew:
        name: watchman
        state: present

    - name: Install cocoapods
      homebrew:
        name: cocoapods
        state: present

    - name: Install OpenJDK zulu
      homebrew_cask:
        name: zulu@17
        state: present
        sudo_password: "{{ ansible_become_pass }}"

    - name: Install EAS CLI globally
      shell: |
        source ~/.nvm/nvm.sh
        nvm use default
        npm install -g eas-cli
      args:
        executable: /bin/zsh
        creates: ~/.nvm/versions/node/v20.19.4/bin/eas

    - name: Check if environment variables exist in ~/.zshrc
      shell: grep -q "JAVA_HOME\|ANDROID_HOME" ~/.zshrc
      register: env_vars_check
      ignore_errors: true
      changed_when: false

    - name: Set environment variables in ~/.zshrc
      blockinfile:
        path: ~/.zshrc
        marker: "# {mark} REACT NATIVE ENVIRONMENT VARIABLES"
        block: |
          export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
          export ANDROID_HOME=$HOME/Library/Android/sdk
          export PATH=$PATH:$ANDROID_HOME/emulator
          export PATH=$PATH:$ANDROID_HOME/platform-tools
      when: env_vars_check.rc != 0

    - name: Source ~/.zshrc
      shell: source ~/.zshrc
      args:
        executable: /bin/zsh